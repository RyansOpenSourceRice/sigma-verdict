name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run pre-commit suite
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: OpenGrep static analysis
        run: |
          curl -sL -o /tmp/opengrep https://github.com/opengrep/opengrep/releases/download/v1.31.0/opengrep_manylinux_x86
          chmod +x /tmp/opengrep
          #  Ada is outside OpenGrep's rule coverage, so this surfaces
          #  findings on scripts/workflows/docs; Ada assurance is
          #  GNATprove flow in build-test-prove (silver tracked to close).
          /tmp/opengrep scan --quiet .

  build-test-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          rm -rf /tmp/alire-dist && mkdir -p /tmp/alire-dist
          unzip -o -q /tmp/alire.zip -d /tmp/alire-dist
          install -m 0755 /tmp/alire-dist/bin/alr "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/alr" --version

      - name: Add Alire indexes
        run: |
          alr -n index --add git+https://github.com/flyology-ada/alire-index.git --name flyology

      - name: Select latest toolchain (non-interactive)
        #  Bare names resolve to the newest available releases, so CI
        #  always builds with the latest GNAT/GPRbuild. -n auto-confirms
        #  the download instead of prompting (a prompt on a headless
        #  runner aborts the job).
        run: alr -n toolchain --select gnat_native gprbuild

      - name: Full local gate (build + tests + flow proof)
        run: sh scripts/verify.sh

      - name: Build examples
        run: alr -n exec -- gprbuild -P examples/examples.gpr

      - name: Upload test binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-binaries
          path: bin/
          if-no-files-found: ignore

  prove-silver:
    #  Tracking job until silver level 2 closes locally; flow (proved)
    #  is the blocking gate in build-test-prove.
    runs-on: ubuntu-24.04
    continue-on-error: true
    #  Silver level 2 exceeds 10 minutes locally; cap the tracking run
    #  so it can never burn the full 6-hour job budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          rm -rf /tmp/alire-dist && mkdir -p /tmp/alire-dist
          unzip -o -q /tmp/alire.zip -d /tmp/alire-dist
          install -m 0755 /tmp/alire-dist/bin/alr "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/alr" --version

      - name: Add Alire indexes
        run: |
          alr -n index --add git+https://github.com/flyology-ada/alire-index.git --name flyology

      - name: Select latest toolchain (non-interactive)
        run: alr -n toolchain --select gnat_native gprbuild

      - name: GNATprove Silver level 2 (proof-only project)
        run: alr -n exec -- gnatprove -P proof/spark_core.gpr --mode=silver --level=2 --checks-as-errors=on
